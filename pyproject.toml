[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "astro-copilot"
version = "0.1.0"
description = "Local astronomical data-reduction copilot MCP server built on Astropy, Photutils, and Lightkurve"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mania Sacha" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "fastmcp>=0.4.0",
    "astropy>=5.3.0",
    "photutils>=1.8.0",
    "lightkurve>=2.4.0",
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
astro-copilot = "astro_copilot.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["astro_copilot*"]
